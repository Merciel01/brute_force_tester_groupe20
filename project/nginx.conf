# nginx.conf
# Configuration nginx pour le dashboard BruteScope
# Proxy les requêtes /api/ et /stream vers l'API Flask

server {
    listen 80;
    server_name localhost;

    # Servir les fichiers statiques du frontend
    root /usr/share/nginx/html;
    index index.html;

    # Compression gzip
    gzip on;
    gzip_types text/css application/javascript application/json;

    # ── Dashboard (fichiers statiques) ────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Proxy vers l'API Flask ────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://api:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # ── Server-Sent Events (SSE) – configuration spéciale ────────────────────
    # Le buffering DOIT être désactivé pour que les événements arrivent en temps réel
    location /stream {
        proxy_pass         http://api:5000/stream;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;

        # CRITIQUE pour SSE :
        proxy_buffering    off;             # Pas de buffer → push immédiat
        proxy_cache        off;
        proxy_read_timeout 86400s;          # Connexion longue durée (24h max)
        chunked_transfer_encoding on;

        # Headers SSE
        add_header Cache-Control    "no-cache";
        add_header X-Accel-Buffering "no";
    }
}
